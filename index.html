<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> gestion de commands</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div class="h"><h1 class="roge">Tableau de bord des commandes</h1>
    <p class="p">Manipulation et analyse de données avec JavaScript</p></div>
    <div class="row">
  <div class="col-auto mb-3">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">commandes</h4>
        <p class="card-text" id="totalCommandes">0</p>
      </div>
    </div>
  </div>
  <div class="col-auto mb-3">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">livréés</h4>
        <p class="card-text" id="totalLivrees">0</p>
      </div>
    </div>
  </div>
  <div class="col-auto mb-3">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">payéés</h4>
        <p class="card-text" id="totalPayees">0</p>
      </div>
    </div>
  </div>
  <div class="col-auto mb-3">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">montant total</h4>
        <p class="card-text" id="montantTotal">0 DH</p>
      </div>
    </div>
  </div>
</div>
<div class="container mt-3">
  <label for="client" class="form-label">
    Rechercher un client
  </label>

  <input
    type="text"
    class="form-control"
    id="client"
    placeholder="Exemple : Sara"
  >
</div>

<div class="card border-0 bg-light text-dark status-card p-3">
    <h5 class="mb-3">Statut de la commande</h5>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <button type="button" class="btn btn-outline-dark bg-white text-dark px-3 active" data-status="Toutes" aria-pressed="true">Toutes</button>
        <button type="button" class="btn btn-outline-dark bg-white text-dark px-3" data-status="Livrée" aria-pressed="false">Livrées</button>
        <button type="button" class="btn btn-outline-dark bg-white text-dark px-3" data-status="En attente" aria-pressed="false">En attente</button>
        <button type="button" class="btn btn-outline-dark bg-white text-dark px-3" data-status="Annulée" aria-pressed="false">Annulées</button>
    </div>

    <div class="form-check">
        <input
            class="form-check-input"
            type="checkbox"
            id="commandesPayees"
        >
        <label class="form-check-label" for="commandesPayees">
            Afficher uniquement les commandes payées hhhhhh
        </label>
    </div>
</div>

<div class="container-fluid bg-light p-4">
    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-bordered mb-0">
<thead>
<tr>
<th>ID</th>
<th>Client</th>
<th>Montant</th>
<th>Statut</th>
<th>Paiement</th>
<th>Date</th>
</tr>
 </thead>
<tbody id="commandesTableBody">
</tbody>
</table>
</div>

</div>


<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>

    
</body>
</html>
